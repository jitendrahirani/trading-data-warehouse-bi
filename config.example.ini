; BI showcase connection settings.
; Copy this file to config.ini (config.ini is gitignored) and change values there if needed.
; Windows authentication is used, so no user name or password is stored anywhere.

[sqlserver]
server = localhost
driver = ODBC Driver 18 for SQL Server
; ODBC Driver 18 encrypts connections by default. A local SQL Server only has a self-signed
; certificate, so the laptop must be told to trust it. Never use this setting against a real server.
trust_server_certificate = yes
database_dev = TradingBI_Dev
database_prod = TradingBI_Prod
